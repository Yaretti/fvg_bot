
name: CI Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check archive exists
        run: test -f fvg-bot.zip

      - name: Extract project archive
        run: |
          mkdir -p /tmp/fvg-unpack
          unzip -oq fvg-bot.zip -d /tmp/fvg-unpack
          test -f /tmp/fvg-unpack/fvg_bot_project/requirements-dev.txt
          cp -a /tmp/fvg-unpack/fvg_bot_project/. .

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -q
