name: Binance FVG Dry Run

run-name: Binance FVG Dry Run (${{ github.event_name }})

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Тривалість WebSocket-тесту в секундах (30–300)"
        required: true
        default: "90"
        type: string

  push:
    branches:
      - main
    paths:
      - "Dry-run.yml"
      - ".github/workflows/Dry-run.yml"
      - "fvg-bot.zip"

  pull_request:
    paths:
      - ".github/workflows/Dry-run.yml"
      - "fvg-bot.zip"

permissions:
  contents: read

concurrency:
  group: fvg-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DRY_RUN: "true"
      DB_PATH: dry_run.sqlite3
      LOG_FILE: dry_run.log
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required archive
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f fvg-bot.zip ]]; then
            echo "::error::Не знайдено fvg-bot.zip у корені репозиторію."
            exit 1
          fi

          command -v unzip >/dev/null
          unzip -t fvg-bot.zip

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/fvg-unpack
          unzip -oq fvg-bot.zip -d /tmp/fvg-unpack

          if [[ ! -f /tmp/fvg-unpack/fvg_bot_project/requirements.txt ]]; then
            echo "::error::В архіві немає fvg_bot_project/requirements.txt."
            find /tmp/fvg-unpack -maxdepth 3 -type f | head -100
            exit 1
          fi

          cp -a /tmp/fvg-unpack/fvg_bot_project/. .

          test -f requirements.txt
          test -d fvg_bot

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check live Binance data once (DRY-RUN)
        shell: bash
        run: |
          set -euo pipefail

          python -m fvg_bot --once --dry-run

      - name: Run WebSocket monitoring (DRY-RUN)
        shell: bash
        env:
          DURATION: ${{ inputs.duration || '90' }}
        run: |
          set -euo pipefail

          if ! [[ "$DURATION" =~ ^[0-9]+$ ]]; then
            echo "::error::Тривалість має бути цілим числом секунд."
            exit 1
          fi

          if (( DURATION < 30 || DURATION > 300 )); then
            echo "::error::Вкажи тривалість від 30 до 300 секунд."
            exit 1
          fi

          python -m fvg_bot --dry-run --duration "$DURATION"

      - name: Write test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Binance FVG Dry Run"
            echo
            echo "- Режим: **DRY-RUN**"
            echo "- Python: **3.12**"
            echo "- Торгові ордери: **не створюються цим workflow**"
            echo
            if [[ -f dry_run.log ]]; then
              echo "### Останні рядки журналу"
              echo '```text'
              tail -n 80 dry_run.log
              echo '```'
            else
              echo "Файл dry_run.log не створено."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fvg-dry-run-results
          if-no-files-found: warn
          retention-days: 7
          path: |
            dry_run.log
            dry_run.sqlite3